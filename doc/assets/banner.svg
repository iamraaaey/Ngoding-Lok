<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" role="img" aria-label="NgeCode Juh! — an AI-assisted gamified platform for learning to code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131c31"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="player" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fbbf77"/>
      <stop offset="1" stop-color="#d97757"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="820" height="240" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="819" height="239" rx="18" fill="none" stroke="#22304a" stroke-width="1"/>

  <!-- ===== left column: title + live editor ===== -->
  <text x="42" y="66" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="url(#title)">NgeCode Juh!</text>
  <text x="44" y="94" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8ea3c0">Learn to code — one command at a time.</text>

  <!-- editor mock -->
  <rect x="42" y="112" width="446" height="58" rx="8" fill="#0d1117" stroke="#233047"/>
  <text x="58" y="132" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#5b6b83">// solve the level</text>

  <!-- blinking prompt (live cursor) -->
  <text x="58" y="156" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#38bdf8">&gt;
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
  </text>

  <!-- cycling module commands -->
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15">
    <text x="78" y="156" fill="#e2e8f0">move.right(); move.down();
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.30;0.36;0.95;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="78" y="156" fill="#facc15" opacity="0">SELECT * FROM users;
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.36;0.63;0.69;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="78" y="156" fill="#fca5a5" opacity="0">engine.start(); throttle(100);
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.63;0.69;0.96;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- module pills -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">
    <rect x="44" y="188" width="60" height="24" rx="12" fill="none" stroke="#38bdf8"/>
    <text x="74" y="204" fill="#38bdf8">Grid</text>
    <rect x="112" y="188" width="56" height="24" rx="12" fill="none" stroke="#facc15"/>
    <text x="140" y="204" fill="#facc15">SQL</text>
    <rect x="176" y="188" width="76" height="24" rx="12" fill="none" stroke="#d97757"/>
    <text x="214" y="204" fill="#d97757">Rocket</text>
    <rect x="260" y="188" width="112" height="24" rx="12" fill="none" stroke="#a78bfa"/>
    <text x="316" y="204" fill="#a78bfa">AI Socratic hints</text>
  </g>

  <!-- ===== right column: grid runner ===== -->
  <rect x="538" y="46" width="154" height="154" rx="10" fill="#0d1117" stroke="#233047"/>
  <!-- grid lines -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="570" y1="48" x2="570" y2="198"/>
    <line x1="600" y1="48" x2="600" y2="198"/>
    <line x1="630" y1="48" x2="630" y2="198"/>
    <line x1="660" y1="48" x2="660" y2="198"/>
    <line x1="540" y1="78" x2="690" y2="78"/>
    <line x1="540" y1="108" x2="690" y2="108"/>
    <line x1="540" y1="138" x2="690" y2="138"/>
    <line x1="540" y1="168" x2="690" y2="168"/>
  </g>

  <!-- start marker -->
  <circle cx="555" cy="63" r="4" fill="#334155"/>

  <!-- goal cell -->
  <rect x="631" y="139" width="28" height="28" rx="5" fill="#d97757" fill-opacity="0.18" stroke="#d97757" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <path d="M639 153 l5 5 l9 -11" fill="none" stroke="#d97757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- player -->
  <g>
    <circle cx="0" cy="0" r="13" fill="#d97757" opacity="0.18"/>
    <circle cx="0" cy="0" r="8" fill="url(#player)"/>
    <animateTransform attributeName="transform" type="translate"
      values="555 63;585 63;615 63;645 63;645 93;645 123;645 153;645 153"
      keyTimes="0;0.11;0.22;0.33;0.44;0.55;0.66;1"
      calcMode="linear" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.9;0.97;1" dur="6s" repeatCount="indefinite"/>
  </g>
</svg>
