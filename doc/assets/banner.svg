<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Ngoding Lok — write, run, learn">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080A0B"/>
      <stop offset="0.55" stop-color="#101518"/>
      <stop offset="1" stop-color="#15100E"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5C01"/>
      <stop offset="1" stop-color="#FFAA63"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151A1D"/>
      <stop offset="1" stop-color="#0C0F11"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2A353A" stroke-width="1" opacity="0.34"/>
    </pattern>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 310C220 245 376 380 616 286S1005 248 1200 163V360H0Z" fill="#FF5C01" opacity="0.045"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="23.5" fill="none" stroke="#344046"/>

  <!-- Brand and summary -->
  <text x="58" y="64" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" letter-spacing="2.3" fill="#52E88B">/// NGODING LOK · LEARNING ARENA</text>
  <text x="58" y="128" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="49" font-weight="800" letter-spacing="-1.5" fill="#F4F7F5">WRITE. RUN.</text>
  <text x="58" y="183" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="49" font-weight="800" letter-spacing="-1.5" fill="url(#ember)">LEARN.</text>
  <text x="60" y="219" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#ABB8BA">A gamified coding and safe cyber-learning prototype.</text>
  <text x="60" y="245" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#6FD0FF">// responsive terminal-noir interface · contextual Socratic hints</text>

  <!-- Fact pills -->
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" letter-spacing="0.7">
    <rect x="58" y="282" width="145" height="34" rx="7" fill="#12181A" stroke="#3B494D"/>
    <circle cx="76" cy="299" r="4" fill="#52E88B" filter="url(#softGlow)"/>
    <text x="89" y="303" fill="#DCE5E2">21 MISSIONS</text>
    <rect x="214" y="282" width="118" height="34" rx="7" fill="#12181A" stroke="#3B494D"/>
    <circle cx="232" cy="299" r="4" fill="#6FD0FF"/>
    <text x="245" y="303" fill="#DCE5E2">4 TRACKS</text>
    <rect x="343" y="282" width="184" height="34" rx="7" fill="#12181A" stroke="#3B494D"/>
    <circle cx="361" cy="299" r="4" fill="#FF5C01" filter="url(#softGlow)"/>
    <text x="374" y="303" fill="#DCE5E2">SAFE CYBER LABS</text>
  </g>

  <!-- Terminal window -->
  <rect x="718" y="34" width="424" height="292" rx="16" fill="#060809" opacity="0.7"/>
  <rect x="710" y="26" width="424" height="292" rx="16" fill="url(#panel)" stroke="#46545A"/>
  <path d="M711 70H1133" stroke="#364249"/>
  <circle cx="738" cy="48" r="5" fill="#FF5C01"/>
  <circle cx="756" cy="48" r="5" fill="#F6CA4E"/>
  <circle cx="774" cy="48" r="5" fill="#52E88B"/>
  <text x="802" y="52" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#94A4A5">mission-console · live</text>

  <rect x="732" y="87" width="380" height="165" rx="9" fill="#080B0C" stroke="#27343A"/>
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14">
    <text x="751" y="119" fill="#58686C">01</text>
    <text x="784" y="119" fill="#52E88B">move.right();</text>
    <text x="751" y="149" fill="#58686C">02</text>
    <text x="784" y="149" fill="#6FD0FF">SELECT name FROM learners;</text>
    <text x="751" y="179" fill="#58686C">03</text>
    <text x="784" y="179" fill="#FFAA63">sys.preflight();</text>
    <text x="751" y="209" fill="#58686C">04</text>
    <text x="784" y="209" fill="#F4F7F5">explore --safe</text>
    <rect x="784" y="220" width="8" height="16" rx="1" fill="#52E88B">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" letter-spacing="0.8">
    <rect x="732" y="270" width="84" height="28" rx="6" fill="#12251C" stroke="#2A6648"/>
    <text x="742" y="288" fill="#7FF2AE">PYTHON</text>
    <rect x="824" y="270" width="61" height="28" rx="6" fill="#1C1930" stroke="#5C4C91"/>
    <text x="838" y="288" fill="#C4B5FD">SQL</text>
    <rect x="893" y="270" width="75" height="28" rx="6" fill="#112027" stroke="#2A5868"/>
    <text x="905" y="288" fill="#85E0FF">JAVA</text>
    <rect x="976" y="270" width="136" height="28" rx="6" fill="#2A1810" stroke="#7A482C"/>
    <text x="988" y="288" fill="#FFB078">CYBERSECURITY</text>
  </g>
</svg>
