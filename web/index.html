<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ngoding Lok - an AI-assisted gamified platform for teaching foundational programming concepts.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ngoding Lok">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ngoding Lok</title>
  <link rel="manifest" href="manifest.json">

  <!--
    AdSense Ad Placement API (H5 rewarded ads) for the hint flow.
    1. Replace ca-pub-XXXXXXXXXXXXXXXX below with your AdSense publisher ID.
    2. Uncomment the script tag.
    Until then the app automatically falls back to the built-in
    sponsor-break preview screen, so nothing breaks without it.
  -->
  <!--
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
    crossorigin="anonymous"
    data-ad-frequency-hint="30s"></script>
  -->
  <script>
    window.adsbygoogle = window.adsbygoogle || [];
    function adBreak(o) { adsbygoogle.push(o); }
    function adConfig(o) { adsbygoogle.push(o); }
    adConfig({ preloadAdBreaks: 'on', sound: 'off' });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
