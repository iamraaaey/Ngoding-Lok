<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ngoding Lok - an AI-assisted gamified platform for teaching foundational programming concepts.">
  <meta name="theme-color" content="#0A0A0B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ngoding Lok">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon: SVG for modern browsers, PNG fallback for older ones. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <title>Ngoding Lok</title>
  <link rel="manifest" href="manifest.json">

  <!--
    AdSense H5 Games / Ad Placement API configuration.

    The async tag below is the exact snippet AdSense issued for site
    verification (publisher ca-pub-2836563830601298); placing it statically
    in <head> is what Google's site review looks for. Its onload sets the
    load flag the Flutter app checks before offering a live rewarded ad, so
    the app never mistakes "still loading" for "no ads", and never pretends
    the local fallback is a live ad. Ad Placement API docs:
    https://developers.google.com/ad-placement
  -->
  <script async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-xxxxxxxxxxxxxxxx"
      crossorigin="anonymous"
      data-ad-frequency-hint="30s"
      onload="window.__NGECODE_ADSENSE_LOADED__ = true;"></script>
  <script>
    window.__NGECODE_ADSENSE_PUBLISHER_ID__ = 'ca-pub-xxxxxxxxxxxxxxxx';
    // Flip to true only after H5 Games approval to preview test ad breaks.
    window.__NGECODE_ADSENSE_TEST_MODE__ = true;
    window.__NGECODE_ADSENSE_CONFIGURED__ = true;
    // Preserve the flag if adsbygoogle.js already fired its onload above.
    window.__NGECODE_ADSENSE_LOADED__ =
      window.__NGECODE_ADSENSE_LOADED__ === true;
    window.adsbygoogle = window.adsbygoogle || [];
    function adBreak(o) { window.adsbygoogle.push(o); }
    function adConfig(o) { window.adsbygoogle.push(o); }
    adConfig({ preloadAdBreaks: 'on', sound: 'off' });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
